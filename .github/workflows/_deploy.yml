name: Reusable - Deploy to Render

on:
  workflow_call:
    inputs:
      env_name:
        required: true
        type: string
    secrets:
      DEPLOY_HOOK:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_name }}
    permissions: {}
    steps:
      - name: Deploy to Render
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
        run: curl -fsS -X POST "$DEPLOY_HOOK"