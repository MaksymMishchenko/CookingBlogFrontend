<aside class="sidebar">  
  <div 
    class="menu-title centered" 
    [style.cursor]="cursorStyle()" 
    (click)="toggleMenu()">
    Recipes
    <span class="arrow" [class.rotate]="isMenuVisible()">&#9660;</span>
  </div>

  <ul class="sidebar-menu" [class.show]="isMenuVisible()">  
    @switch (viewState()) {
      
      @case ('loading') {        
        <li class="skeleton-item"><div class="skeleton-line"></div></li>
        <li class="skeleton-item"><div class="skeleton-line"></div></li>
        <li class="skeleton-item"><div class="skeleton-line"></div></li>
        <li class="skeleton-item"><div class="skeleton-line"></div></li>
        <li class="skeleton-item"><div class="skeleton-line"></div></li>
      }

      @case ('error') {
        <li class="info-item error-message centered">
          {{ statusMessage() }}
        </li>
      }

      @case ('empty') {
        <li class="info-item empty-state centered">
          {{ statusMessage() }}
        </li>
      }

      @case ('data') {        
        <li>
          <a 
            routerLink="/" 
            routerLinkActive="active-link" 
            [routerLinkActiveOptions]="{exact: true}" 
            (click)="closeMenu()">
            All Recipes
          </a>
        </li>

        @for (category of categories(); track category.id) {
          <li>
            <a 
              [routerLink]="['/category', category.slug]" 
              routerLinkActive="active-link" 
              (click)="closeMenu()">
              {{ category.name }}
            </a>
          </li>
        }
      }
    }
  </ul>
</aside>
