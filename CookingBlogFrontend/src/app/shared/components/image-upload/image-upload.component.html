<div class="upload-container">
      @if (!previewUrl()) {        
        <div 
          class="drop-zone"
          [class.dragover]="isDragOver()"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event)"
          (click)="fileInput.click()">
          <div class="upload-content">
            <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <p class="upload-text">Drag & drop image here or <span class="browse-link">browse</span></p>
            <p class="upload-hint">Supports: JPG, PNG, WEBP</p>
          </div>
          <input 
            #fileInput
            type="file" 
            accept="image/jpeg,image/png,image/webp" 
            class="hidden-input"
            data-cy="image-file-input"
            (change)="onFileSelected($event)">
        </div>
      } @else {        
        <div class="preview-zone">
          <div class="preview-wrapper">
            <img [src]="previewUrl()" alt="Preview" class="image-preview" />
            <div class="preview-actions">
              <button type="button" class="btn-remove" (click)="removeImage()" title="Remove image">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
                <span>Remove</span>
              </button>
            </div>
          </div>
        </div>
      }
    </div>
