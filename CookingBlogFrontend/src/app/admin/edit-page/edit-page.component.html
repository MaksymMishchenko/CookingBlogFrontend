<div class="edit-post-container">
    <h2 class="page-title">Edit Recipe</h2>

    @let state = viewState();

    @if (state.status === 'loading') {
    <div class="skeleton-form-wrapper" cy-data="loading">
        <div class="skeleton-field-group">
            <div class="skeleton-line skeleton-label"></div>
            <div class="skeleton-input-box"></div>
        </div>

        <div class="skeleton-field-group">
            <div class="skeleton-line skeleton-label"></div>
            <div class="skeleton-textarea-box"></div>
        </div>

        <div class="skeleton-field-group">
            <div class="skeleton-line skeleton-label"></div>
            <div class="skeleton-editor-box"></div>
        </div>

        <div class="skeleton-field-group">
            <div class="skeleton-line skeleton-label"></div>
            <div class="skeleton-input-box"></div>
        </div>

        <div class="skeleton-field-group">
            <div class="skeleton-line skeleton-label"></div>
            <div class="skeleton-input-box"></div>
        </div>

        <div class="skeleton-field-group">
            <div class="skeleton-line skeleton-label"></div>
            <div class="skeleton-textarea-box sm"></div>
        </div>

        <div class="skeleton-field-group">
            <div class="skeleton-line skeleton-label"></div>
            <div class="skeleton-input-box"></div>
        </div>

        <div class="skeleton-field-group">
            <div class="skeleton-line skeleton-label"></div>
            <div class="skeleton-input-box"></div>
        </div>

        <div class="skeleton-field-group">
            <div class="skeleton-line skeleton-label"></div>
            <div class="skeleton-input-box"></div>
        </div>

        <div class="skeleton-actions-row">
            <div class="skeleton-btn"></div>
            <div class="skeleton-btn short"></div>
        </div>
    </div>
    } @else if (state.status === 'error') {
    <div class="error-banner">
        <p>{{messages.LOAD_FORM_DATA_FAILED}}</p>
        <button class="btn btn-red" (click)="retryLoad()">{{buttons.RELOAD_PAGE}}</button>
    </div>
    } @else if (state.status === 'empty') {
    <div class="error-banner">
        <p>{{ messages.NO_CATEGORIES_AVAILABLE }}</p>
        <button class="btn btn-red" (click)="onFormCancel()">{{buttons.GO_BACK}}</button>
    </div>
    } @else if (state.status === 'success' && state.categories) {
    <app-post-form 
        [categories]="state.categories"
        [serverError]="serverError()" 
        [postData]="state.currentPost" 
        [disabled]="state.isSubmitting"
        [mode]="'edit'"        
        (postSubmit)="onUpdatePost($event)"
        (formCancel)="onFormCancel()">
    </app-post-form>
    }
</div>
