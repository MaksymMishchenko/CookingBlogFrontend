<div class="create-post-container">
    <h2 class="page-title">Create New Recipe</h2>

    @let state = viewState();

    @if (state.hasError) {
    <div class="error-banner">
        <p>⚠️ Failed to load form. Please check your server connection.</p>
        <button class="btn btn-red" (click)="retryLoad()">Reload Page</button>
    </div>
    } @else if (state.isLoading) {
    <div class="loader">
        <p>Loading form, please wait...</p>
    </div>
    } @else if (state.categories) {
    <app-post-form [categories]="state.categories" [disabled]="state.isSubmitting" (postSubmit)="onCreatePost($event)"
        (formCancel)="onFormCancel()">
    </app-post-form>
    }
</div>
